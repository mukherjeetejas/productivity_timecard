name: Health Check + Email

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # safer than 14

jobs:
  ping-endpoints:
    runs-on: ubuntu-latest

    steps:
      - name: Ping API Health Endpoint
        id: api
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://productivity-timecard.onrender.com/user/health)
          echo "API_STATUS=$STATUS" >> $GITHUB_ENV

      - name: Ping UI Login Endpoint
        id: ui
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://productivity-ui-1.onrender.com/login)
          echo "UI_STATUS=$STATUS" >> $GITHUB_ENV

      - name: Send Email on Success
        if: env.API_STATUS == '200' && env.UI_STATUS == '200'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Health Check Passed"
          to: your-email@gmail.com
          from: your-email@gmail.com
          body: |
            API Status: ${{ env.API_STATUS }}
            UI Status: ${{ env.UI_STATUS }}
            Time: $(date)

      - name: Fail if any endpoint failed
        if: env.API_STATUS != '200' || env.UI_STATUS != '200'
        run: exit 1
