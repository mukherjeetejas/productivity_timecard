name: Hourly Health Check

on:
  workflow_dispatch:       # Allows manual trigger from GitHub UI
  schedule: 
    - cron: '*/14 * * * *'  # Every 14 minutes (keeps app warm)

jobs:
  ping-endpoints:
    runs-on: ubuntu-latest

    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Hitting API: https://productivity-timecard.onrender.com/user/health"
          response=$(curl --silent --write-out "\nHTTP_STATUS:%{http_code}" \
            --location 'https://productivity-timecard.onrender.com/user/health')
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS")
          
          echo "Status Code: $http_status"
          echo "Response: $body"
          
          if [ "$http_status" -ne 200 ]; then
            echo "❌ API health check FAILED with status $http_status"
            exit 1
          fi
          echo "✅ API health check passed"

      - name: Ping UI Login Endpoint
        run: |
          echo "Hitting UI: https://productivity-ui-1.onrender.com/login"
          response=$(curl --silent --write-out "\nHTTP_STATUS:%{http_code}" \
            --location 'https://productivity-ui-1.onrender.com/login')
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          
          echo "Status Code: $http_status"
          
          if [ "$http_status" -ne 200 ]; then
            echo "❌ UI health check FAILED with status $http_status"
            exit 1
          fi
          echo "✅ UI health check passed"
